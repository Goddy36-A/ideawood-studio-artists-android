name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  # Same whisper.cpp release the Windows app bundles, so speech timing behaves identically
  WHISPER_TAG: b5130

jobs:
  # 1) The Kotlin engine must behave exactly like the desktop Python engine, and the render commands it
  #    produces must really work in ffmpeg + libass.
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Parity tests (Kotlin vs desktop engine)
        run: |
          mkdir -p logs
          ./gradlew --no-daemon --console=plain --no-build-cache cleanTestDebugUnitTest :app:testDebugUnitTest 2>&1 | tee logs/gradle-test.log
      - name: Render real clips with the generated ffmpeg commands
        timeout-minutes: 8
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          cd app/build/smoke
          for d in job*; do
            ( cd "$d"
              mkdir -p fonts && cp ../../../src/main/assets/fonts/*.ttf fonts/
              ffmpeg -v error -y -f lavfi -i "sine=frequency=330:duration=70" song.wav
              ffmpeg -v error -y -f lavfi -i testsrc2=s=1920x1080 -frames:v 1 img.jpg
              mapfile -t ARGS < cmd.txt
              timeout 120 ffmpeg -nostdin -v error "${ARGS[@]}"
              test -s out.mp4
              ffprobe -v error -show_entries stream=codec_name,width,height,duration -of csv=p=0 out.mp4
            )
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-report, path: app/build/reports/tests }
      - name: Publish logs to branch ci-logs-engine (for debugging without a browser)
        if: always()
        run: |
          mkdir -p logs
          d=$(mktemp -d); cp -r logs/. "$d"/
          rm -rf /tmp/pub && git init -q /tmp/pub && cd /tmp/pub
          git checkout -q -b ci-logs-engine
          cp -r "$d"/. . && echo "run ${{ github.run_id }} sha ${{ github.sha }}" > RUN.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "logs run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-engine

  # 2) whisper.cpp (same release as the desktop app) compiled for Android as an executable
  whisper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: whisper-out
          key: whisper-android-${{ env.WHISPER_TAG }}-v2
      - name: Build whisper-cli for arm64 (baseline + fast) and armeabi-v7a
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p logs
          exec > >(tee logs/whisper-build.log) 2>&1
          set -e
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          git clone --depth 1 --branch "$WHISPER_TAG" https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          mkdir -p whisper-out
          build() { # $1 = name, $2 = ABI, $3 = extra cmake flags, $4 = output file name
            cmake -S whisper.cpp -B "build-$1" -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$2 -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
              -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF -DWHISPER_SDL2=OFF \
              -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_LLAMAFILE=OFF $3
            cmake --build "build-$1" --target whisper-cli -j"$(nproc)"
            BIN=$(find "build-$1" -name whisper-cli -type f | head -n1)
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "$BIN"
            mkdir -p "whisper-out/$2" && cp "$BIN" "whisper-out/$2/$4"
          }
          build base arm64-v8a "" libwhisper_cli.so
          build fast arm64-v8a "-DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16" libwhisper_cli_fast.so
          build v7 armeabi-v7a "-DANDROID_ARM_NEON=ON" libwhisper_cli.so
          ls -laR whisper-out
      - uses: actions/upload-artifact@v4
        with: { name: whisper-cli-android, path: whisper-out }
      - name: Publish logs to branch ci-logs-whisper (for debugging without a browser)
        if: always()
        run: |
          mkdir -p logs
          d=$(mktemp -d); cp -r logs/. "$d"/
          rm -rf /tmp/pub && git init -q /tmp/pub && cd /tmp/pub
          git checkout -q -b ci-logs-whisper
          cp -r "$d"/. . && echo "run ${{ github.run_id }} sha ${{ github.sha }}" > RUN.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "logs run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-whisper

  # 3) The installable APK
  apk:
    needs: [engine, whisper]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: { name: whisper-cli-android, path: app/src/main/jniLibs }
      - name: Create a debug signing key (sideload builds)
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Build APK
        run: |
          mkdir -p logs
          ./gradlew --no-daemon --console=plain :app:assembleRelease 2>&1 | tee logs/gradle-apk.log
      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/IdeawoodStudio-Artists-${GITHUB_RUN_NUMBER}.apk
      - name: List native libs inside the APK (debug)
        run: |
          mkdir -p logs
          unzip -l dist/*.apk | grep -E "lib/" > logs/apk-libs.txt || true
          for a in arm64-v8a armeabi-v7a; do echo "$a: $(grep -c "lib/$a/" logs/apk-libs.txt) files" >> logs/apk-libs-summary.txt; done
      - name: Check FFmpeg features inside the APK (debug)
        run: |
          mkdir -p logs x && cd x && unzip -q -o ../dist/*.apk "lib/armeabi-v7a/*" "lib/arm64-v8a/*" || true
          for f in lib/armeabi-v7a/libavfilter_neon.so lib/armeabi-v7a/libavfilter.so lib/armeabi-v7a/libavcodec_neon.so; do
            [ -f "$f" ] || continue
            echo "$f: libass=$(strings -a $f | grep -ci libass) xfade=$(strings -a $f | grep -ci xfade) fontconfig=$(strings -a $f | grep -ci fontconfig) x264=$(strings -a $f | grep -ci x264) mediacodec=$(strings -a $f | grep -ci h264_mediacodec)" >> ../logs/apk-ffmpeg-features.txt
          done
          cd .. && ls -la x/lib/armeabi-v7a >> logs/apk-ffmpeg-features.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with: { name: IdeawoodStudio-Artists-apk, path: dist/*.apk }
      - name: Publish logs to branch ci-logs-apk (for debugging without a browser)
        if: always()
        run: |
          mkdir -p logs
          d=$(mktemp -d); cp -r logs/. "$d"/
          rm -rf /tmp/pub && git init -q /tmp/pub && cd /tmp/pub
          git checkout -q -b ci-logs-apk
          cp -r "$d"/. . && echo "run ${{ github.run_id }} sha ${{ github.sha }}" > RUN.txt
          git add -A && git -c user.name=ci -c user.email=ci@local commit -q -m "logs run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-apk
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.apk }
