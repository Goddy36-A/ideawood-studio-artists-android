name: Probe FFmpeg AARs
on:
  push:
    paths: [".github/workflows/probe-ffmpeg.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check which FFmpeg AARs exist and which ABIs they contain
        run: |
          mkdir -p out && cd out
          M=https://repo1.maven.org/maven2
          B=com/moizhassan/ffmpeg/ffmpeg-kit-16kb/6.1.1
          curl -s -L -o a.aar "$M/$B/ffmpeg-kit-16kb-6.1.1.aar"; curl -s -L -o a.pom "$M/$B/ffmpeg-kit-16kb-6.1.1.pom"
          ls -la a.aar | tee -a result.txt
          echo "-- armeabi-v7a libs:" | tee -a result.txt
          unzip -l a.aar | grep "jni/armeabi-v7a/" | awk '{print $4}' | tee -a result.txt
          echo "-- pom deps:" | tee -a result.txt
          grep -E "groupId|artifactId|version" a.pom | tee -a result.txt
          echo "-- classes:" | tee -a result.txt
          unzip -p a.aar classes.jar > c.jar; unzip -l c.jar | grep -E "FFmpegKitConfig.class|FFprobeKit.class|MediaInformation.class" | awk '{print $4}' | tee -a result.txt
          d=$(mktemp -d); cp result.txt "$d"/; cd /tmp && rm -rf pub && git init -q pub && cd pub
          git checkout -q -b probe-logs && cp "$d"/result.txt . && git add -A
          git -c user.name=ci -c user.email=ci@local commit -q -m probe
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-logs
